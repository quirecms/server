---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly: the image's packages get known flaws while its code doesn't change
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Quality checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run as this runner's user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the dev image
        run: docker compose -f compose.dev.yaml build php
      - name: Install dependencies
        run: docker compose -f compose.dev.yaml run --rm php composer install --no-interaction --no-progress
      - name: Code style, Rector, PHPStan, tests
        run: docker compose -f compose.dev.yaml run --rm php composer qa
      - name: Audit dependencies
        run: docker compose -f compose.dev.yaml run --rm php composer audit

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        # Every shell script (*.sh, and the quire-server command), as POSIX sh
        run: docker run --rm -v "$PWD:/m:ro" koalaman/shellcheck-alpine:v0.11.0 sh -c 'shellcheck -s sh -e SC2016 /m/bin/quire-server $(find /m -name "*.sh" -not -path "/m/vendor/*")'

  image:
    name: The agent's image, scanned
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build it
        run: docker build --pull --target server -t quire-server-agent:scan .
      - name: Known flaws its packages have a fix for (fails)
        # The image's own system packages: fixed by building it again (apk upgrade), so none may ship.
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro aquasec/trivy:0.58.1 image --quiet --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 quire-server-agent:scan
      - name: Known flaws of the tools it bundles (listed)
        # restic, cosign, Docker's CLI: fixed by new releases of theirs, which Dependabot proposes
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro aquasec/trivy:0.58.1 image --quiet --pkg-types library --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 quire-server-agent:scan
