parameters:
    quire_server.root: '%env(QUIRE_SERVER_ROOT)%'
    quire_server.agent_image: quire-server-agent

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Only the services that manage databases get the administrative connection.
            Doctrine\DBAL\Connection $admin: '@doctrine.dbal.admin_connection'

    Quire\Server\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Site/{Site,SiteName,Domain,ServerPaths,EnvFile}.php'
            - '../src/Docker/{PolicyContext,SiteProject,PolicyViolation,RuntimeImageNotTrusted}.php'
            - '../src/Backup/BackupFailed.php'
            - '../src/Operation/{Operation,SiteRequest,AddedSite}.php'
            - '../src/Process/{ProcessResult,ProcessFailed}.php'
            - '../src/Update/{Lock,UpdatePlan,SkeletonFiles,UpdateFailed}.php'
            - '../src/Git/Repository.php'
            - '../src/Network/{Ipv4Cidr,SiteSubnets}.php'
            - '../src/Release/{Release,Version,ReleaseVerificationFailed,Feed}.php'
            - '../src/ServerUpdate/{ServerBackup,ServerUpdateFailed}.php'
            - '../src/ServerDatabase/{DatabaseUpgrade,DatabaseUpgradeFailed,DatabaseCheck,PostgresImages}.php'

    Quire\Server\Process\ProcessRunner: '@Quire\Server\Process\SymfonyProcessRunner'

    Quire\Server\Site\ServerPaths:
        arguments: ['%quire_server.root%']

    # The Docker gate: the agent's own operations on its trusted socket (DOCKER_HOST), each site's on a
    # socket of the site's own (compose.yaml mounts them)
    Quire\Server\Docker\Gate:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'
            $scopes: /run/quire-gate/scopes
            $sockets: /run/quire-gate/sites
            # Sites' Docker configurations: the agent's own (its /tmp is its own, in memory)
            $configs: /tmp/quire-server-docker

    Quire\Server\Docker\Builders:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'
            # Written by the host-setup service (gate/host-setup.sh)
            $facts: /run/quire-host/builder-apparmor

    Quire\Server\Docker\SandboxNetwork:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'

    # Sites' addresses (D-34): the range they come from, checked against Docker's networks
    Quire\Server\Network\SiteNetworkRange:
        arguments: ['%env(QUIRE_SERVER_SITE_NETWORKS)%']

    Quire\Server\Network\DockerSubnets:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'

    Quire\Server\Network\SiteLinks:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'

    Quire\Server\Docker\RuntimeImages:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'

    Quire\Server\Process\ContainerRunner:
        arguments:
            $runner: '@Quire\Server\Process\SymfonyProcessRunner'
            $dockerHost: '%env(DOCKER_HOST)%'
            # The agent's own image: a release's, by digest, or the one built from a checkout
            $image: '%env(default:quire_server.agent_image:QUIRE_SERVER_IMAGE)%'
            $work: '%quire_server.root%/server/work'

    Quire\Server\Update\Composer:
        arguments:
            $runner: '@Quire\Server\Process\ContainerRunner'

    Quire\Server\Backup\SiteDatabaseDumps:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'

    Quire\Server\FrontDoor\DomainDirectory:
        arguments: ['%quire_server.root%/server/domains']

    Quire\Server\Operation\SiteManager:
        arguments:
            $mailerDsn: '%env(QUIRE_SERVER_MAILER_DSN)%'

    Quire\Server\Git\GitPoller:
        arguments:
            $seconds: '%env(int:QUIRE_SERVER_GIT_POLL_SECONDS)%'

    Quire\Server\Console\VersionCommand:
        arguments:
            $version: '%env(QUIRE_SERVER_VERSION)%'
            $image: '%env(QUIRE_SERVER_IMAGE)%'

    Quire\Server\ServerUpdate\ServerFolder:
        arguments:
            $root: '%quire_server.root%'

    Quire\Server\ServerUpdate\ServerStack:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'
            $postgresPassword: '%env(QUIRE_SERVER_POSTGRES_PASSWORD)%'

    Quire\Server\ServerUpdate\ServerUpdater:
        arguments:
            $root: '%quire_server.root%'
            $running: '%env(QUIRE_SERVER_VERSION)%'
            $wait: '%env(int:QUIRE_SERVER_UPDATE_WAIT_SECONDS)%'

    Quire\Server\Console\ServerUpdateCommand:
        arguments:
            $inUpdater: '%env(bool:QUIRE_SERVER_UPDATER)%'

    Quire\Server\ServerDatabase\DatabaseContainers:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'
            $postgresPassword: '%env(QUIRE_SERVER_POSTGRES_PASSWORD)%'

    Quire\Server\ServerDatabase\DatabaseUpgrader:
        arguments:
            $root: '%quire_server.root%'
            $wait: '%env(int:QUIRE_SERVER_UPDATE_WAIT_SECONDS)%'

    Quire\Server\Console\DatabaseUpgradeCommand:
        arguments:
            $inUpdater: '%env(bool:QUIRE_SERVER_UPDATER)%'

    Quire\Server\Update\AutomaticUpdates:
        arguments:
            $hour: '%env(QUIRE_SERVER_UPDATE_HOUR)%'

    Quire\Server\Update\ReleaseCheck:
        arguments:
            $admin: '@doctrine.dbal.admin_connection'

    Quire\Server\Backup\BackupSettings:
        arguments:
            $repository: '%env(QUIRE_SERVER_BACKUP_REPOSITORY)%'
            $accessKey: '%env(QUIRE_SERVER_BACKUP_ACCESS_KEY)%'
            $secretKey: '%env(QUIRE_SERVER_BACKUP_SECRET_KEY)%'
            $password: '%env(QUIRE_SERVER_BACKUP_PASSWORD)%'
            $region: '%env(QUIRE_SERVER_BACKUP_REGION)%'
            $host: '%env(QUIRE_SERVER_BACKUP_HOST)%'
            $hour: '%env(QUIRE_SERVER_BACKUP_HOUR)%'
            $keep: '%env(QUIRE_SERVER_BACKUP_KEEP)%'

    Quire\Server\Backup\LocalBackups:
        arguments:
            $root: '%quire_server.root%/backups'

    Quire\Server\Backup\Restic:
        arguments:
            $cache: '%quire_server.root%/backups/.restic-cache'

    Quire\Server\Backup\OffsiteBackups:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'
            $postgresAdminUrl: '%env(QUIRE_SERVER_POSTGRES_ADMIN_URL)%'

    Quire\Server\Console\BackupsSetupCommand:
        arguments:
            $cache: '%quire_server.root%/backups/.restic-cache'
            $inUpdater: '%env(bool:QUIRE_SERVER_UPDATER)%'

    Quire\Server\Console\AddSiteCommand:
        arguments:
            $defaultVersion: '%env(QUIRE_SERVER_QUIRE_VERSION)%'
