services:
  php:
    image: quire-sites/jane/php-prod
    build:
      context: .
      target: frankenphp_prod
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 256
    networks:
      default:
      quire-edge:
        aliases: [jane.example]
      quire-data:
    volumes:
      - storage_data:/app/storage
    tmpfs: [/tmp]
    environment:
      APP_SECRET: ${APP_SECRET}
    deploy:
      resources:
        limits: {cpus: '1.5', memory: 512m, pids: 256}

volumes:
  storage_data:
networks:
  quire-edge:
    external: true
  quire-data:
    external: true
