---
name: End to end

# The whole server in a Docker-in-Docker machine of its own: installed with install.sh over a site set
# up by hand, a real site from Packagist added and removed, the front door's routing and refusals, the
# sites' isolation. It takes a while, so documentation changes don't run it; it also runs on releases,
# every night (what isn't pinned changes: Quire's releases on Packagist and its runtime images,
# Sigstore), and by hand.
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end:
    # Each part on a machine of its own, at the same time: the server installed, then adopting a site
    # installed before it; adding, updating and removing sites; Git mode; the latest published
    # release, checked and installed by this install.sh (with its agent: nothing built); the server,
    # from this checkout, updating itself to a published release; or backups off the server.
    name: End to end (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [adopt, sites, git, release, update, backups]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the agent
        if: matrix.part != 'release'
        run: docker build --pull -t quire-server-agent:test .
      - name: Run the server end to end
        run: tests/e2e/run.sh ${{ matrix.part != 'release' && 'quire-server-agent:test' || '' }}
        env:
          E2E_ONLY: ${{ matrix.part }}
