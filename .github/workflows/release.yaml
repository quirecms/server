---
name: Release

# A version tag (v1.2.3) on main makes a release: the agent's image for x86_64 and arm64 on
# ghcr.io/quirecms/server, with its SBOM and build provenance, and a GitHub release with the server's
# files (quire-server-<version>.tar.gz), install.sh, and release.env, which names the image by digest
# and the archive by checksum. The image and release.env are signed with Sigstore (keyless: the
# signature says this workflow made them, for this tag); install.sh checks both before running
# anything.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository == 'quirecms/server'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # the GitHub release
      packages: write   # the image on ghcr.io
      id-token: write   # Sigstore's keyless signing: this workflow's identity
    env:
      IMAGE: ghcr.io/quirecms/server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The version, from a tag on main
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::$GITHUB_REF_NAME isn't a version."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME isn't on main."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the agent's image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: QUIRE_SERVER_VERSION=${{ steps.version.outputs.version }}
          # How it was built, and what's in it, attached to the image
          provenance: mode=max
          sbom: true

      - name: No known flaw with a fix in its packages
        # Before it's signed: an image that fails here is never installed (servers check the signature).
        run: docker run --rm aquasec/trivy:0.58.1 image --quiet --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE@${{ steps.image.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign the image
        run: cosign sign --yes "$IMAGE@${{ steps.image.outputs.digest }}"

      - name: The release's files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir dist
          # The server's files, as Git has them (without the tests and the development's: .gitattributes)
          git archive --format=tar.gz --prefix="quire-server-$VERSION/" -o "dist/quire-server-$VERSION.tar.gz" "$GITHUB_SHA"
          # The installer, installing this version
          sed "s/^release=''\$/release='$VERSION'/" install.sh > dist/install.sh
          grep -q "^release='$VERSION'\$" dist/install.sh
          {
            echo "VERSION=$VERSION"
            echo "IMAGE=$IMAGE@$DIGEST"
            echo "ARCHIVE=quire-server-$VERSION.tar.gz"
            echo "ARCHIVE_SHA256=$(sha256sum "dist/quire-server-$VERSION.tar.gz" | cut -d ' ' -f 1)"
            echo "INSTALL_SH_SHA256=$(sha256sum dist/install.sh | cut -d ' ' -f 1)"
          } > dist/release.env
          cat dist/release.env

      - name: Sign the release
        run: |
          cosign sign-blob --yes --bundle dist/release.env.sigstore.json dist/release.env
          cosign sign-blob --yes --bundle dist/install.sh.sigstore.json dist/install.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Quire Server $VERSION" --generate-notes "${prerelease[@]}"
