# New versions of what Quire Server is built from, proposed as pull requests: GitHub Actions (pinned by
# commit), Docker images (pinned by digest: the Dockerfile's and compose.yaml's), and Composer packages.
# Their titles start with "chore:", so dependency updates can be told apart in main's history (ADR-0010).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      development:
        dependency-type: development
