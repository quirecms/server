---
name: Release

# A version tag (v1.2.3) on main makes a release: the agent's image for x86_64 and arm64 on
# ghcr.io/quirecms/server, with its SBOM and build provenance, and a GitHub release with the server's
# files (quire-server-<version>.tar.gz), install.sh, and release.env, which names the image by digest
# and the archive by checksum, with the changelog's section for the version as its notes. The image and release.env are signed with Sigstore (keyless: the
# signature says this workflow made them, for this tag); install.sh checks both before running
# anything. A release with release candidates ships its highest candidate's image, the one that was
# tested (.github/release-image.sh), with only its version changed (.github/promote.Dockerfile: no
# layer is built again, .github/release-promote-check.sh), signed for its own tag. Every image is run
# before it's signed: it must say it's the release, as an update checks.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is released only when it's signed by a key in .github/release-signers (ADR-0010): a job of its
  # own, with no credentials but reading, which the release needs. Anyone who can push a tag could
  # otherwise have this workflow build, sign and publish a release.
  signed:
    name: Signed by a release signer
    if: github.repository == 'quirecms/server'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is signed by a key in .github/release-signers
        run: .github/verify-tag.sh "$GITHUB_REF_NAME"

  release:
    name: Release
    needs: signed
    if: github.repository == 'quirecms/server'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write   # the GitHub release
      checks: read      # CI's checks of the tagged commit
      packages: write   # the image on ghcr.io
      id-token: write   # Sigstore's keyless signing: this workflow's identity
    env:
      IMAGE: ghcr.io/quirecms/server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The version, from a tag on main
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::$GITHUB_REF_NAME isn't a version."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME isn't on main."; exit 1; }
          # Its notes: the changelog's section for it (a pre-release, 0.4.0-rc.1, may use 0.4.0's)
          section=$version
          grep -qF "## [$section] - " CHANGELOG.md || section=${version%%-*}
          grep -qF "## [$section] - " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "section=$section" >> "$GITHUB_OUTPUT"

      - name: CI passed on it
        # A tag alone makes no release: the commit must have passed CI's checks (on main, after its pull
        # request). They may still be running when the tag is pushed: waited for, half an hour at most.
        # Asked by name, every page read: a commit has a set of runs for main and for each of its tags
        # (End to end runs on each), and past the first page (30) the check looked missing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in 'Quality checks and tests' 'Shell scripts' "The agent's image, scanned"; do
            for attempt in $(seq 60); do
              conclusion=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" -f check_name="$check" -F per_page=100 --paginate --slurp \
                | jq -r 'map(.check_runs[]) | sort_by(.started_at) | last | if . == null then "missing" else (.conclusion // "running") end')
              [ "$conclusion" = running ] || [ "$conclusion" = missing ] || break
              sleep 30
            done
            [ "$conclusion" = success ] || { echo "::error::CI's \"$check\" on $GITHUB_SHA: $conclusion. No release without it."; exit 1; }
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Where the image comes from
        # Built, or the highest release candidate's when there is one: that one must be on this commit,
        # and its release.env and image signed for its own tag, or there's no release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # Not piped: the default shell has no pipefail, and a refusal must stop the release
        run: |
          .github/release-image.sh "$VERSION" "$GITHUB_SHA" "$IMAGE" > "$RUNNER_TEMP/source"
          cat "$RUNNER_TEMP/source"
          cat "$RUNNER_TEMP/source" >> "$GITHUB_OUTPUT"

      # Promoted images too: the arm64 one is run before it's signed
      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By its digest only: the version names it once it's scanned and signed ("Tag the signed image"),
      # so a tag never names an image that failed either (ADR-0010 §7)
      - name: Build and push the agent's image
        id: image
        if: steps.source.outputs.mode == 'build'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          pull: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: QUIRE_SERVER_VERSION=${{ steps.version.outputs.version }}
          # How it was built, and what's in it, attached to the image
          provenance: mode=max
          sbom: true

      # The candidate's image, checked by release-image.sh, by its digest only (never a tag again)
      - name: A candidate to promote, by digest
        if: steps.source.outputs.mode == 'promote'
        env:
          TESTED: ${{ steps.source.outputs.digest }}
        run: |
          printf '%s\n' "$TESTED" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "::error::No checked candidate digest: \"$TESTED\"."; exit 1; }

      # Its layers as they are, with this release's version (what the agent says it is, and its label)
      - name: The candidate's image with this release's version
        id: promoted
        if: steps.source.outputs.mode == 'promote'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github
          file: .github/promote.Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            TESTED=${{ env.IMAGE }}@${{ steps.source.outputs.digest }}
            QUIRE_SERVER_VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Nothing but its version changed
        id: promote_check
        if: steps.source.outputs.mode == 'promote'
        env:
          TESTED: ${{ steps.source.outputs.digest }}
          FINAL: ${{ steps.promoted.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        # Not piped: a refusal must stop the release
        run: |
          .github/release-promote-check.sh "$IMAGE" "$TESTED" "$FINAL" "$VERSION" > "$RUNNER_TEMP/promoted"
          cat "$RUNNER_TEMP/promoted" >> "$GITHUB_OUTPUT"

      - name: The image's digest
        id: digest
        env:
          BUILT: ${{ steps.image.outputs.digest }}
          PROMOTED: ${{ steps.promote_check.outputs.digest }}
        run: |
          digest=${PROMOTED:-$BUILT}
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::No image digest: \"$digest\"."; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: It runs, and says it's this release
        # As an update checks it (the first line of "server:version"), on each platform: an image that
        # says another version is never signed (v0.7.0's said 0.7.0-rc.2, and every update to it was
        # refused). Nothing but the image: no network, settings or volumes. Its label says it too.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --quiet --platform "$platform" "$IMAGE@$DIGEST" > /dev/null
            out=$(docker run --rm --platform "$platform" --network none "$IMAGE@$DIGEST" bin/console server:version)
            said=$(printf '%s\n' "$out" | head -n 1)
            [ "$said" = "Quire Server $VERSION" ] || { echo "::error::On $platform, the image says \"$said\", not Quire Server $VERSION: an update to it would be refused."; exit 1; }
            label=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Image}}' | jq -r --arg platform "$platform" '.[$platform].config.Labels["org.opencontainers.image.version"]')
            [ "$label" = "$VERSION" ] || { echo "::error::On $platform, the image's version label is \"$label\", not $VERSION."; exit 1; }
          done

      - name: No known flaw with a fix in its packages
        # Before it's signed: an image that fails here is never installed (servers check the signature).
        # A candidate's image again too: a flaw found since it was tested goes through a new candidate.
        run: docker run --rm aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --quiet --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE@${{ steps.digest.outputs.digest }}"

      - name: Sign the image
        # For this tag: a candidate's image then has both signatures, its candidate's and this release's
        run: cosign sign --yes "$IMAGE@${{ steps.digest.outputs.digest }}"

      - name: Tag the signed image
        # The version names exactly the image scanned and signed: tagged as it is (one source, so the
        # index is copied unchanged), then read back. Another digest under the tag is a failed release.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ "$tagged" = "$DIGEST" ] || { echo "::error::$IMAGE:$VERSION is $tagged, not the signed $DIGEST."; exit 1; }

      - name: The release's files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          CANDIDATE: ${{ steps.source.outputs.candidate }}
          APPROVED: ${{ steps.promote_check.outputs.digest }}
        run: |
          mkdir dist
          # The server's files, as Git has them (without the tests and the development's: .gitattributes)
          git archive --format=tar.gz --prefix="quire-server-$VERSION/" -o "dist/quire-server-$VERSION.tar.gz" "$GITHUB_SHA"
          # The installer, installing this version
          sed "s/^release=''\$/release='$VERSION'/" install.sh > dist/install.sh
          grep -q "^release='$VERSION'\$" dist/install.sh
          {
            echo "VERSION=$VERSION"
            echo "IMAGE=$IMAGE@$DIGEST"
            echo "ARCHIVE=quire-server-$VERSION.tar.gz"
            echo "ARCHIVE_SHA256=$(sha256sum "dist/quire-server-$VERSION.tar.gz" | cut -d ' ' -f 1)"
            echo "INSTALL_SH_SHA256=$(sha256sum dist/install.sh | cut -d ' ' -f 1)"
          } > dist/release.env
          cat dist/release.env
          # A promoted image: this release names exactly the one checked to be $CANDIDATE's with only its version changed
          if [ -n "$CANDIDATE" ]; then
            grep -qx "IMAGE=$IMAGE@$APPROVED" dist/release.env || { echo "::error::release.env doesn't name the image checked against $CANDIDATE's ($APPROVED)."; exit 1; }
          fi

      - name: Sign the release
        run: |
          cosign sign-blob --yes --bundle dist/release.env.sigstore.json dist/release.env
          cosign sign-blob --yes --bundle dist/install.sh.sigstore.json dist/install.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SECTION: ${{ steps.version.outputs.section }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          CANDIDATE: ${{ steps.source.outputs.candidate }}
        run: |
          # The changelog's section for the version, and the image by digest
          awk -v heading="## [$SECTION] - " 'index($0, "## [") == 1 || /^\[[^]]+\]: / { if (found) exit; if (index($0, heading) == 1) { found = 1; next } } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md's section for $SECTION is empty."; exit 1; }
          printf '\n**Image:** `%s@%s`%s\n' "$IMAGE" "$IMAGE_DIGEST" "${CANDIDATE:+ (the layers tested as $CANDIDATE, with its version set to $VERSION)}" >> notes.md
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Quire Server $VERSION" --notes-file notes.md "${prerelease[@]}"
