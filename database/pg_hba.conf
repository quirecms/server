# Who may log in to the server's PostgreSQL, and from where (D-34). The first line that matches decides;
# every password is checked with SCRAM-SHA-256.

# Inside PostgreSQL's own container: its first start, and what the agent and the updater run there
# (dumps, restores, upgrades). Only what can act on Docker gets in there.
local   all  all                 scram-sha-256
host    all  all  127.0.0.1/32   scram-sha-256
host    all  all  ::1/128        scram-sha-256

# The agent writes these: the server's roles only from the server's network, each site's role to its
# own database only from its link
include_if_exists /etc/postgresql/access/server.conf
include_if_exists /etc/postgresql/access/sites.conf

# Nothing else, from anywhere
host    all  all  all            reject
