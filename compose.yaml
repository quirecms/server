# Quire Server: the front door, the agent, the Docker gate and PostgreSQL. Sites are Compose projects
# of their own, in /srv/quire/sites, joined to these networks. Every image is pinned by digest.
# Run it with "quire-server", or:
#
#     docker compose --env-file server.env up --wait
#
# See README.md.
name: quire-server

services:
  # The only part visitors reach: certificates and routing to sites by domain.
  front:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    ports:
      - {name: http, target: 80, published: 80, protocol: tcp}
      - {name: https, target: 443, published: 443, protocol: tcp}
      - {name: http3, target: 443, published: 443, protocol: udp}
    environment:
      # Caddy's "email" option, only when an email is set (an empty one is invalid)
      QUIRE_SERVER_ACME_EMAIL_OPTION: ${QUIRE_SERVER_ACME_EMAIL:+email ${QUIRE_SERVER_ACME_EMAIL}}
      # Empty for Let's Encrypt; "local_certs" for a test server (Caddy's own certificate authority)
      QUIRE_SERVER_TLS_GLOBAL: ${QUIRE_SERVER_TLS_GLOBAL:-}
    volumes:
      - ./front/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./front/pages:/etc/caddy/pages:ro
      - ${QUIRE_SERVER_ROOT:-/srv/quire}/server/domains:/srv/quire/server/domains:ro
      - front_data:/data
      - front_config:/config
    networks:
      - quire-edge
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 1024

  # The only part that can act on Docker (through the gate): adds and removes sites, keeps the front
  # door's domains in line. It has no network listener.
  agent:
    # A release's image, by digest (written to server.env by install.sh, after checking its signature),
    # or one built from this folder (compose.build.yaml, for installs from a checkout).
    image: ${QUIRE_SERVER_IMAGE:-quire-server-agent}
    restart: unless-stopped
    depends_on:
      database: {condition: service_healthy}
      gate: {condition: service_started}
      host-setup: {condition: service_completed_successfully}
    environment: &agent-environment
      APP_SECRET: ${QUIRE_SERVER_APP_SECRET:?Set QUIRE_SERVER_APP_SECRET in server.env}
      DATABASE_URL: postgresql://quire_server:${QUIRE_SERVER_DATABASE_PASSWORD:?Set QUIRE_SERVER_DATABASE_PASSWORD in server.env}@quire-database:5432/quire_server?serverVersion=18&charset=utf8
      QUIRE_SERVER_POSTGRES_ADMIN_URL: postgresql://postgres:${QUIRE_SERVER_POSTGRES_PASSWORD:?Set QUIRE_SERVER_POSTGRES_PASSWORD in server.env}@quire-database:5432/postgres?serverVersion=18&charset=utf8
      QUIRE_SERVER_MAILER_DSN: ${QUIRE_SERVER_MAILER_DSN:-}
      QUIRE_SERVER_QUIRE_VERSION: ${QUIRE_SERVER_QUIRE_VERSION:-^0.1}
      QUIRE_SERVER_ROOT: ${QUIRE_SERVER_ROOT:-/srv/quire}
      # Which release runs ("quire-server version")
      QUIRE_SERVER_IMAGE: ${QUIRE_SERVER_IMAGE:-}
      # The private range sites' networks get their addresses from: a /26 per site
      QUIRE_SERVER_SITE_NETWORKS: ${QUIRE_SERVER_SITE_NETWORKS:-10.72.0.0/16}
      # Git mode sites that deploy by themselves: how often their branch is asked for new commits
      QUIRE_SERVER_GIT_POLL_SECONDS: ${QUIRE_SERVER_GIT_POLL_SECONDS:-300}
      # The hour (UTC) from which sites get their automatic updates each night ("site:updates"), or "off"
      QUIRE_SERVER_UPDATE_HOUR: ${QUIRE_SERVER_UPDATE_HOUR:-3}
      # Backups off the server ("quire-server backups:setup"): restic, on S3-compatible storage
      QUIRE_SERVER_BACKUP_REPOSITORY: ${QUIRE_SERVER_BACKUP_REPOSITORY:-}
      QUIRE_SERVER_BACKUP_ACCESS_KEY: ${QUIRE_SERVER_BACKUP_ACCESS_KEY:-}
      QUIRE_SERVER_BACKUP_SECRET_KEY: ${QUIRE_SERVER_BACKUP_SECRET_KEY:-}
      QUIRE_SERVER_BACKUP_PASSWORD: ${QUIRE_SERVER_BACKUP_PASSWORD:-}
      QUIRE_SERVER_BACKUP_REGION: ${QUIRE_SERVER_BACKUP_REGION:-us-east-1}
      QUIRE_SERVER_BACKUP_HOST: ${QUIRE_SERVER_BACKUP_HOST:-quire-server}
      QUIRE_SERVER_BACKUP_HOUR: ${QUIRE_SERVER_BACKUP_HOUR:-2}
      QUIRE_SERVER_BACKUP_KEEP: ${QUIRE_SERVER_BACKUP_KEEP:-7 daily, 4 weekly, 6 monthly}
      # The gate's listener for the agent's own operations; each site's Compose runs on the site's
      # own socket (/run/quire-gate/sites/<project>.sock), for the scope the agent writes
      DOCKER_HOST: unix:///run/quire-gate/trusted/trusted.sock
    volumes:
      # The gate's sockets (read-only: the gate makes them), and the sites' scope files it reads
      - gate_trusted:/run/quire-gate/trusted:ro
      - gate_sites:/run/quire-gate/sites:ro
      - gate_scopes:/run/quire-gate/scopes
      # What host-setup found (the AppArmor profile sites' builders run under)
      - host_facts:/run/quire-host:ro
      # Who may log in to PostgreSQL from where (DatabaseAccess): only the agent writes it
      - database_access:/run/quire-database/access
      # The same paths inside as on the host: Compose resolves sites' paths for the Docker daemon.
      - ${QUIRE_SERVER_ROOT:-/srv/quire}/sites:${QUIRE_SERVER_ROOT:-/srv/quire}/sites
      - ${QUIRE_SERVER_ROOT:-/srv/quire}/backups:${QUIRE_SERVER_ROOT:-/srv/quire}/backups
      - ${QUIRE_SERVER_ROOT:-/srv/quire}/server/domains:${QUIRE_SERVER_ROOT:-/srv/quire}/server/domains
      # Git mode sites' deploy keys: only the agent sees them
      - ${QUIRE_SERVER_ROOT:-/srv/quire}/server/keys:${QUIRE_SERVER_ROOT:-/srv/quire}/server/keys
      # Copies of sites' files for programs run in containers of their own (Composer): the same path
      # on the host, which Docker mounts into them
      - ${QUIRE_SERVER_ROOT:-/srv/quire}/server/work:${QUIRE_SERVER_ROOT:-/srv/quire}/server/work
    networks:
      - quire-data
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 1024

  # Updates the server itself ("quire-server update"): only run on demand, never by "up". It is the
  # release that runs now (it checks the new one before using any of it), and it replaces the server's
  # files and containers, the gate's too: so it gets Docker itself and the server's folder.
  # It runs only this release's code and takes no input but a version; it ends with its update.
  updater:
    image: ${QUIRE_SERVER_IMAGE:-quire-server-agent}
    profiles: [update]
    entrypoint: [/sbin/tini, --]
    command: [bin/console, server:update]
    environment:
      <<: *agent-environment
      DOCKER_HOST: unix:///var/run/docker.sock
      QUIRE_SERVER_UPDATER: 1
      # pg_dump and pg_restore of the server's database, in its container
      QUIRE_SERVER_POSTGRES_PASSWORD: ${QUIRE_SERVER_POSTGRES_PASSWORD:?Set QUIRE_SERVER_POSTGRES_PASSWORD in server.env}
      QUIRE_SERVER_UPDATE_WAIT_SECONDS: ${QUIRE_SERVER_UPDATE_WAIT_SECONDS:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The same paths inside as on the host: Compose resolves the server's paths for the Docker daemon.
      - ${QUIRE_SERVER_ROOT:-/srv/quire}/server:${QUIRE_SERVER_ROOT:-/srv/quire}/server
      - ${QUIRE_SERVER_ROOT:-/srv/quire}/backups:${QUIRE_SERVER_ROOT:-/srv/quire}/backups
    networks:
      - quire-data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 1024

  # The Docker gate (YorvoGate): the only way to Docker but the updater's. It reads each request's body
  # and checks it before Docker gets it: the agent's own operations on one socket, each site's Compose
  # on a socket of its own, scoped to the site (gate/yorvogate.yaml says what each may do). It has no
  # network at all: only the agent mounts its sockets. Root without capabilities, as Docker's socket
  # is root's (whoever holds that socket is root on the host anyway).
  gate:
    image: ghcr.io/yorvolabs/yorvogate:0.2.1@sha256:7bedfd8c5cf443e4db63ab519ea4ed19a0d72048e626440cdd1378f11f84dccd
    restart: unless-stopped
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gate/yorvogate.yaml:/etc/yorvogate/yorvogate.yaml:ro
      - gate_scopes:/etc/yorvogate/sites:ro
      - gate_trusted:/run/yorvogate/trusted
      - gate_sites:/run/yorvogate/sites
      # Where it keeps an image a site's build loads while it checks the image's names (on disk, not
      # in memory: a site's image is hundreds of megabytes)
      - gate_spool:/tmp
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 256

  # What the host needs for sites' builds (gate/host-setup.sh): the AppArmor profile their rootless
  # BuildKit runs under, loaded with the host's own tools. It runs at each start of the server, before
  # the agent, and ends: privileged, in the host's root, with no network. What it found goes to the
  # agent (host_facts).
  host-setup:
    image: ${QUIRE_SERVER_IMAGE:-quire-server-agent}
    restart: "no"
    entrypoint: [/bin/sh, -euc]
    command:
      - chroot /host /bin/sh -s </opt/quire-server/gate/host-setup.sh >/facts/builder-apparmor.new && mv /facts/builder-apparmor.new /facts/builder-apparmor
    privileged: true
    network_mode: none
    volumes:
      - /:/host
      - host_facts:/facts

  # The server's PostgreSQL: the registry's database, and a database per site.
  database:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${QUIRE_SERVER_POSTGRES_PASSWORD:?Set QUIRE_SERVER_POSTGRES_PASSWORD in server.env}
      POSTGRES_DB: postgres
      QUIRE_SERVER_DATABASE_PASSWORD: ${QUIRE_SERVER_DATABASE_PASSWORD:?Set QUIRE_SERVER_DATABASE_PASSWORD in server.env}
      # SCRAM only: no password travels or is stored in a weaker form.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - ./database/init.sh:/docker-entrypoint-initdb.d/10-quire-server.sh:ro
      - database_data:/var/lib/postgresql
      # Its logins' rules, not the data folder's: the server's own, and the agent's (read-only here)
      - ./database/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - database_access:/etc/postgresql/access:ro
    networks:
      quire-data:
        aliases: [quire-database]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Room for several sites' connections, and some kept for the server's own (its registry):
    # sites at their limit (32 each) can't lock the agent out.
    # Logins by address (database/pg_hba.conf): each site's role only from its link.
    command: [postgres, -c, max_connections=200, -c, reserved_connections=10, -c, hba_file=/etc/postgresql/pg_hba.conf]
    security_opt: [no-new-privileges:true]
    shm_size: 256m

networks:
  # The front door's own, its way out (certificates). Sites aren't on it: the front door reaches each
  # on the site's link (quire-link-<project>, D-34), which the agent connects it to.
  quire-edge:
    name: quire-edge
  # PostgreSQL, the agent and the updater. Sites reach PostgreSQL on their links.
  quire-data:
    name: quire-data

volumes:
  front_data:
  front_config:
  database_data:
  database_access:
  gate_trusted:
  gate_sites:
  gate_scopes:
  gate_spool:
  host_facts:
