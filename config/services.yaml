parameters:
    quire_server.root: '%env(QUIRE_SERVER_ROOT)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Only the services that manage databases get the administrative connection.
            Doctrine\DBAL\Connection $admin: '@doctrine.dbal.admin_connection'

    Quire\Server\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Site/{Site,SiteName,Domain,ServerPaths,EnvFile}.php'
            - '../src/Docker/{PolicyContext,SiteProject,PolicyViolation}.php'
            - '../src/Operation/{Operation,SiteRequest,AddedSite}.php'
            - '../src/Process/{ProcessResult,ProcessFailed}.php'
            - '../src/Update/{Lock,UpdatePlan,SkeletonFiles,UpdateFailed}.php'
            - '../src/Git/Repository.php'
            - '../src/Release/{Release,Version,ReleaseVerificationFailed,Feed}.php'
            - '../src/ServerUpdate/{ServerBackup,ServerUpdateFailed}.php'

    Quire\Server\Process\ProcessRunner: '@Quire\Server\Process\SymfonyProcessRunner'

    Quire\Server\Site\ServerPaths:
        arguments: ['%quire_server.root%']

    Quire\Server\Docker\Compose:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'

    Quire\Server\Docker\Images:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'

    Quire\Server\FrontDoor\DomainDirectory:
        arguments: ['%quire_server.root%/server/domains']

    Quire\Server\Operation\SiteManager:
        arguments:
            $mailerDsn: '%env(QUIRE_SERVER_MAILER_DSN)%'

    Quire\Server\Git\GitPoller:
        arguments:
            $seconds: '%env(int:QUIRE_SERVER_GIT_POLL_SECONDS)%'

    Quire\Server\Console\VersionCommand:
        arguments:
            $version: '%env(QUIRE_SERVER_VERSION)%'
            $image: '%env(QUIRE_SERVER_IMAGE)%'

    Quire\Server\ServerUpdate\ServerFolder:
        arguments:
            $root: '%quire_server.root%'

    Quire\Server\ServerUpdate\ServerStack:
        arguments:
            $dockerHost: '%env(DOCKER_HOST)%'
            $postgresPassword: '%env(QUIRE_SERVER_POSTGRES_PASSWORD)%'

    Quire\Server\ServerUpdate\ServerUpdater:
        arguments:
            $root: '%quire_server.root%'
            $running: '%env(QUIRE_SERVER_VERSION)%'
            $wait: '%env(int:QUIRE_SERVER_UPDATE_WAIT_SECONDS)%'

    Quire\Server\Console\ServerUpdateCommand:
        arguments:
            $inUpdater: '%env(bool:QUIRE_SERVER_UPDATER)%'

    Quire\Server\Update\AutomaticUpdates:
        arguments:
            $hour: '%env(QUIRE_SERVER_UPDATE_HOUR)%'

    Quire\Server\Update\ReleaseCheck:
        arguments:
            $admin: '@doctrine.dbal.admin_connection'

    Quire\Server\Console\AddSiteCommand:
        arguments:
            $defaultVersion: '%env(QUIRE_SERVER_QUIRE_VERSION)%'
